<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>手机相机测试</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./camera.js"></script>
</head>
<body>
<main>
<header>
<p class="eyebrow">设备兼容性测试</p>
<h1>手机相机测试</h1>
<p>请在手机企业微信内打开本页。画面和照片只在当前页面预览，不上传、不保存到相册。</p>
</header>
<section aria-label="相机">
<div class="viewer">
  <div id="placeholder" class="placeholder">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h4l2-2h4l2 2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>等待打开相机</span>
  </div>
  <video id="video" autoplay playsinline muted aria-label="实时取景" hidden></video>
  <canvas id="photo" role="img" aria-label="拍照预览" hidden></canvas>
</div>
<p id="status" role="status" aria-live="polite">点击「打开相机」开始测试。</p>
<div class="controls">
  <button id="open" type="button">打开相机</button>
  <button id="take" type="button" hidden>拍照</button>
  <button id="retry" type="button" hidden>重拍</button>
  <button id="close" type="button" class="secondary" hidden>关闭相机</button>
</div>
</section>
<section class="feedback" aria-label="测试结果">
<h2>测试结果</h2>
<p id="context"></p>
<p>请反馈：能否看到实时画面、能否拍照和重拍、是否出现相册。失败时发出页面显示的错误文字即可，无需发送照片。</p>
</section>
</main>
</body>
</html>
